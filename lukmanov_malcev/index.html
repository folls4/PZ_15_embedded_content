<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практическая работа №15</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <main>
        <section class="media">
            <h2>Карта района</h2>
            <iframe src="./embedded/map.html" title="Интерактивная карта района города"></iframe>
        </section>

        <section class="media">
            <h2>Видеоролик</h2>
            <video controls poster="./media/poster.svg">
                <source src="./media/city.mp4" type="video/mp4">
                <source src="./media/city.webm" type="video/webm">
            </video>
        </section>

        <section class="media">
            <h2>Аудиозапись</h2>
            <audio controls>
                <source src="./media/interview.mp3" type="audio/mpeg">
                <source src="./media/interview.ogg" type="audio/ogg">
            </audio>
        </section>
    </main>

</body>
</html>
