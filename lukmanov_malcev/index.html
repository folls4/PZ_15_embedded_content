<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практическая работа №15</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <main>
        <section class="media">
            <h2>Карта района</h2>
            <iframe src="https://openstreetmap.org" title="Интерактивная карта центра города"></iframe>
        </section>

        <section class="media">
            <h2>Видеоролик</h2>
            <video controls poster="https://unsplash.com">
                <source src="https://googleapis.com" type="video/mp4">
            </video>
        </section>

        <section class="media">
            <h2>Аудиозапись</h2>
            <audio controls>
                <source src="https://soundhelix.com" type="audio/mpeg">
            </audio>
        </section>
    </main>

</body>
</html>
